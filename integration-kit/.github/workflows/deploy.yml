# COPY THIS FILE AS-IS - DO NOT MODIFY
# All configuration comes from service-metadata.yml in your repo root
#
# Branch policy (dev) and all deployment settings are enforced centrally
# by the reusable workflow in wso2-pipeline

name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: philkaks/wso2-pipeline/.github/workflows/build-deploy-register.yml@main
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
      WSO2_ADMIN_PASSWORD: ${{ secrets.WSO2_ADMIN_PASSWORD }}
